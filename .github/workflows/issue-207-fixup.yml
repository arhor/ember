name: Issue 207 fixup

on:
  push:
    branches:
      - issue-207-telegram-api-v2

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-207-telegram-api-v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Update Telegram runbook for issue 207
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const path = "docs/architecture/telegram-surface-runbook.md";
          let text = await readFile(path, "utf8");
          const replacements = [
            [
              'summary: "Current Telegram surface runbook: Bot API 10.3 long polling, principal/scope privacy mapping, issue #88 restart-safe delivery reconciliation, systemd user supervision, and secret-safe configuration."',
              'summary: "Current Telegram surface runbook: Bot API 10.3 long polling via node-telegram-bot-api 2.1.0, principal/scope privacy mapping, restart-safe delivery reconciliation, systemd supervision, and secret-safe configuration."',
            ],
            [
              '> Status: current implementation/runbook from issue #86, with principal/privacy policy\n> hardened by issue #87 and restart-safe delivery reconciliation added by issue #88.',
              '> Status: current implementation/runbook from issue #86, with principal/privacy policy\n> hardened by issue #87, restart-safe delivery reconciliation added by issue #88, and\n> protocol plumbing migrated to `node-telegram-bot-api@2.1.0` by issue #207.',
            ],
            [
              "Ember's first messaging surface uses the official HTTP-based Telegram Bot API directly\nfrom Node.js 26. No Telegram npm runtime dependency is added.",
              "Ember's first messaging surface uses the official HTTP-based Telegram Bot API through\nexactly `node-telegram-bot-api@2.1.0` on Node.js 26. Ember uses the package as a\nnarrow protocol client, not as the owner of polling, retries, replay, delivery truth,\nor runtime lifecycle. Production construction is centralized with `maxRetries: 0`,\nso one Ember delivery attempt maps to one underlying Telegram send attempt.",
            ],
            [
              '`SIGINT`/`SIGTERM` aborts the current long poll. If cognition is active, the same\nAbortSignal is passed into the provider boundary so shutdown remains explicit rather\nthan abandoning a hidden model process.',
              '`SIGINT`/`SIGTERM` aborts an idle `getUpdates` request promptly and stops admission of\nnew updates. An update already admitted into Ember is allowed to finish its bounded\nprovider/delivery handoff before the worker exits; shutdown does not issue a later\nacknowledgement-bearing poll for that update. The systemd stop timeout remains the\nouter bound, so forced termination is recorded as real process loss rather than a\nfabricated clean completion.',
            ],
            [
              '- a successful `sendMessage` response records `confirmed` and the returned Telegram\n  message id;\n- an explicit non-retryable Bot API rejection records definite `failed`;\n- flood control with a valid `parameters.retry_after` records definite retryable\n  `failed` plus the transport-neutral retry delay; and\n- network loss, malformed/unreadable acknowledgement, server-side ambiguity, or process\n  loss after the send boundary records or reconciles to `uncertain`.',
              '- a successful `sendMessage` response with a runtime-valid positive `message_id`\n  records `confirmed` and that returned Telegram message id;\n- `TelegramApiError` for a non-5xx rejection records definite `failed`;\n- Telegram 429 with `retryAfter` records definite retryable `failed` plus the\n  transport-neutral retry delay; and\n- `NetworkError`, `TimeoutError`, `ParseError`, 5xx ambiguity, malformed successful\n  evidence, caller abort after the send may have entered transport, or process loss\n  after that boundary records or reconciles to `uncertain`.\n\nThe generated API client is always constructed with `maxRetries: 0`. The library may\nclassify protocol failures, but only Ember reconciliation decides whether a later\ntransport attempt is safe.',
            ],
            [
              'Normal\nrepository tests use deterministic fake HTTP/provider boundaries and require no token.',
              'Normal repository tests use the generated API client with injected `fetch` plus\ndeterministic API/provider boundaries and require no token.',
            ],
            [
              '- Bot API rejection versus uncertain network/server delivery;',
              '- one underlying send attempt for success, 400, 429, 5xx, malformed JSON/result,\n  body-read loss, network loss, timeout, and caller-abort cases;\n- Bot API rejection versus uncertain network/server/protocol delivery;',
            ],
          ];
          for (const [from, to] of replacements) {
            if (!text.includes(from)) throw new Error(`runbook replacement source not found: ${from.slice(0, 80)}`);
            text = text.replace(from, to);
          }
          await writeFile(path, text);
          NODE
      - run: npm run lint:fix
      - run: npm run fmt
      - name: Commit fixup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "chore: format and document Telegram migration"
          git push
