name: Format PR 178

on:
  push:
    branches:
      - research/178-vercel-ai-sdk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/178-vercel-ai-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - name: Format research record
        run: npm run fmt -- docs/architecture/vercel-ai-sdk-modular-cognition-evaluation.md docs/architecture/README.md
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/vercel-ai-sdk-modular-cognition-evaluation.md docs/architecture/README.md
          git commit -m "docs: format Vercel AI SDK evaluation"
          git push origin HEAD:research/178-vercel-ai-sdk
