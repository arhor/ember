name: Issue 188 test migration

on:
  push:
    branches:
      - issue-188-generalize-provider-invocation
    paths:
      - "scripts/issue-188-test-migration.mjs"
      - ".github/workflows/issue-188-test-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Apply semantic provider test migration
        run: |
          sed -i 's/import \* as ts from "typescript";/import ts from "typescript";/' scripts/issue-188-test-migration.mjs
          node scripts/issue-188-test-migration.mjs
      - name: Apply repository lint fixes
        run: npx oxlint --fix
      - name: Apply repository formatting
        run: npx oxfmt
      - name: Remove temporary migration files
        run: rm scripts/issue-188-test-migration.mjs .github/workflows/issue-188-test-migration.yml
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate tests to semantic provider invocation"
          git push origin HEAD:issue-188-generalize-provider-invocation
      - name: Verify strict lint
        run: npx oxlint --deny-warnings --format=agent
      - name: Verify repository checks
        run: npm run check
      - name: Verify documentation tests
        run: npm run test:docs
      - name: Verify acceptance suite
        run: npm test
      - name: Verify endogenous evaluation
        run: npm run eval:endogenous
