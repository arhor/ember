name: Issue 84 format probe

on:
  pull_request:
    paths:
      - "eval/runtime-resource/constrained-host.ts"
      - ".github/workflows/issue-84-format-probe.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npx oxfmt eval/runtime-resource/constrained-host.ts
      - run: cat eval/runtime-resource/constrained-host.ts
