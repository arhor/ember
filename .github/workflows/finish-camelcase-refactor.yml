name: Finish camelCase refactor

on:
  push:
    branches:
      - finish-camelcase-model-refactor

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Apply camelCase completion
        run: node scripts/finish-camelcase-refactor.mjs
      - name: Format
        run: npm run fmt
      - name: Validate
        shell: bash
        run: |
          set +e
          npm run check > camelcase-check.txt 2>&1
          check_status=$?
          npm test > camelcase-test.txt 2>&1
          test_status=$?
          set -e

          if [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            cat camelcase-check.txt
            cat camelcase-test.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: capture camelCase refactor failure"
            git push
            exit 1
          fi

          rm camelcase-check.txt camelcase-test.txt
          rm snake-report.txt scripts/report-snake-case.mjs scripts/finish-camelcase-refactor.mjs
          rm .github/workflows/finish-camelcase-refactor.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finish camelCase model migration"
          git push
