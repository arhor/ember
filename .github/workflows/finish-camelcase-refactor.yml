name: Finish camelCase refactor

on:
  push:
    branches:
      - finish-camelcase-model-refactor

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Report snake_case property-like names
        run: node scripts/report-snake-case.mjs > snake-report.txt
      - name: Publish report to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-report.txt
          git commit -m "chore: capture snake-case report"
          git push
