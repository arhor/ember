name: Finish camelCase refactor

on:
  push:
    branches:
      - finish-camelcase-model-refactor

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Report snake_case property declarations
        run: node scripts/report-snake-case.mjs
