name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Install locked development toolchain
        run: npm ci

      - name: Apply strict TypeScript migration fixes
        run: |
          node scripts/strict-ts-migration.mjs
          npx oxfmt

      - name: Commit strict TypeScript migration fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "fix: satisfy stricter TypeScript checks"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run static and repository checks
        run: npm run check

      - name: Run complete acceptance suite
        run: npm test

      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous

      - name: Exercise documentation discovery projections
        run: |
          node scripts/docs-discovery.mjs list > /tmp/docs-default.txt
          node scripts/docs-discovery.mjs list --deep > /tmp/docs-deep.txt
          node scripts/docs-discovery.mjs list --all > /tmp/docs-all.txt
          node scripts/docs-discovery.mjs list --headings docs/architecture/design-directions.md docs/research/memory-and-remembering.md > /tmp/docs-headings.txt
