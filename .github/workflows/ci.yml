name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked development toolchain
        run: pnpm install

      - name: Run static and repository checks
        run: pnpm check

      - name: Run complete acceptance suite
        run: pnpm test

      - name: Run deterministic endogenous selectivity evaluation
        run: pnpm eval:endogenous

      - name: Exercise documentation discovery projections
        run: |
          node scripts/docs-discovery.ts list > /tmp/docs-default.txt
          node scripts/docs-discovery.ts list --deep > /tmp/docs-deep.txt
          node scripts/docs-discovery.ts list --all > /tmp/docs-all.txt
          node scripts/docs-discovery.ts list --headings docs/architecture/design-directions.md docs/research/memory-and-remembering.md > /tmp/docs-headings.txt
