name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Node.js version
        run: node --version

      - name: Install locked development toolchain
        run: npm ci

      - name: Run static and repository checks
        run: npm run check

      - name: Run complete acceptance suite
        run: npm test

      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous

      - name: Exercise documentation discovery projections
        run: |
          node scripts/docs-discovery.mjs list > /tmp/docs-default.txt
          node scripts/docs-discovery.mjs list --deep > /tmp/docs-deep.txt
          node scripts/docs-discovery.mjs list --all > /tmp/docs-all.txt
          node scripts/docs-discovery.mjs list --headings docs/architecture/design-directions.md docs/research/memory-and-remembering.md > /tmp/docs-headings.txt
