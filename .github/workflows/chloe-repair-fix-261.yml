name: Chloe repair PR 261 fix workflow

on:
  push:
    branches:
      - chloe/218-cross-surface-conversation-continuity

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Repair patch anchors
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/chloe-fix-261.yml';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              "'        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\\n        selected_exchange_count: number;'",
              "'        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\\n        max_exchanges: number;'",
            ],
            [
              "'        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\\n        membership: ConversationMembershipResolution | null;\\n        selected_exchange_count: number;'",
              "'        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\\n        membership: ConversationMembershipResolution | null;\\n        max_exchanges: number;'",
            ],
            [
              "'            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\\n            selected_exchange_count: 0,'",
              "'            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\\n            max_exchanges: RECENT_DIALOGUE_MAX_EXCHANGES,'",
            ],
            [
              "'            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\\n            membership,\\n            selected_exchange_count: 0,'",
              "'            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\\n            membership,\\n            max_exchanges: RECENT_DIALOGUE_MAX_EXCHANGES,'",
            ],
          ];
          for (const [before, after] of replacements) {
            if (!text.includes(before)) throw new Error(`repair anchor missing: ${before}`);
            text = text.replace(before, after);
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Commit repair
        run: |
          rm .github/workflows/chloe-repair-fix-261.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair review workflow anchors"
          git push origin HEAD:${{ github.ref_name }}
