name: TypeScript runtime evaluation

on:
  pull_request:
    paths:
      - "experiments/runtime-evaluation/**"
      - "src/ember/**"
      - "test/**"
      - "test-fixtures/**"
      - "bin/**"
      - "docs/architecture/typescript-runtime-evaluation.md"
      - ".github/workflows/runtime-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 24 control
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Capture Node 24 path
        shell: bash
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          node --version
          npm --version

      - name: Install Node 26 candidate
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Capture Node 26 paths
        shell: bash
        run: |
          echo "NODE26=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM26=$(command -v npm)" >> "$GITHUB_ENV"
          node --version
          npm --version

      - name: Install Deno candidate
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Capture Deno path and host
        shell: bash
        run: |
          echo "DENO=$(command -v deno)" >> "$GITHUB_ENV"
          deno --version
          uname -a
          lscpu | sed -n '1,20p'
          free -h

      - name: Run repository documentation discovery
        run: "$NODE24" scripts/docs-discovery.mjs list

      - name: Validate unchanged JavaScript control on Node 24
        shell: bash
        run: |
          "$NODE24" --test
          "$NODE24" --test tests/docs-discovery.test.mjs tests/docs-discovery-repository.test.mjs
          "$NODE24" scripts/docs-discovery.mjs check
          PATH="$(dirname "$NODE24"):$PATH" npm run check

      - name: Validate unchanged JavaScript implementation on Node 26
        run: "$NODE26" --test

      - name: Install exact Node TypeScript experiment dependencies
        working-directory: experiments/runtime-evaluation
        shell: bash
        run: |
          "$NPM26" install --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --version
          du -sk node_modules

      - name: Type-check and directly execute the Node TypeScript port
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PROVIDER_COMMAND: ${{ env.NODE26 }}
          EMBER_EVAL_PROVIDER_PREFIX_ARGS: '[]'
        run: |
          ./node_modules/.bin/tsc -p tsconfig.json
          "$NODE26" --test test/*.test.ts
          "$NODE26" ecosystem/mcp-node.ts

      - name: Check and execute the Deno TypeScript port
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PROVIDER_COMMAND: ${{ env.DENO }}
          EMBER_EVAL_PROVIDER_PREFIX_ARGS: '["run","-A"]'
        run: |
          "$DENO" check src/*.ts test/*.test.ts ecosystem/mcp-deno.ts
          "$DENO" test -A test/*.test.ts
          "$DENO" lint
          set +e
          "$DENO" fmt --check 2>&1 | tee "$RUNNER_TEMP/deno-format-check.log"
          echo "deno_fmt_check_status=${PIPESTATUS[0]}" | tee -a "$RUNNER_TEMP/deno-format-check.log"
          set -e
          "$DENO" run ecosystem/mcp-deno.ts

      - name: Probe unchanged current JavaScript suite under Deno without changing the oracle
        continue-on-error: true
        shell: bash
        run: "$DENO" test -A test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/deno-current-oracle.log"

      - name: Probe current production CLI directly under Deno
        shell: bash
        run: |
          state="$RUNNER_TEMP/deno-current-cli.json"
          "$DENO" run -A bin/ember.mjs init --state "$state" --name Ember --principal user-1
          "$DENO" run -A bin/ember.mjs check --state "$state"
          printf ':ask hello from Deno\n:quit\n' | "$DENO" run -A bin/ember.mjs run \
            --state "$state" --principal user-1 --scope project:ember/docs \
            --provider-command "$DENO" --provider-arg run --provider-arg -A \
            --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2

      - name: Exercise Deno permission boundaries
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PERMISSION_SENTINEL: visible
        run: |
          target="$RUNNER_TEMP/permission-input.txt"
          output="$RUNNER_TEMP/permission-output.txt"
          printf 'readable\n' > "$target"
          expect_denied() {
            if "$DENO" run --no-prompt permission-probe.ts "$@" >"$RUNNER_TEMP/permission-$1.out" 2>"$RUNNER_TEMP/permission-$1.err"; then
              echo "expected $1 denial but command succeeded" >&2
              return 1
            fi
          }
          expect_denied env
          "$DENO" run --no-prompt --allow-env=EMBER_EVAL_PERMISSION_SENTINEL permission-probe.ts env
          expect_denied read "$target"
          "$DENO" run --no-prompt --allow-read="$target" permission-probe.ts read "$target"
          expect_denied write "$output"
          "$DENO" run --no-prompt --allow-write="$output" permission-probe.ts write "$output"
          expect_denied run "$NODE26"
          "$DENO" run --no-prompt --allow-run="$NODE26" permission-probe.ts run "$NODE26"
          expect_denied net
          "$DENO" run --no-prompt --allow-net=127.0.0.1:9 permission-probe.ts net

      - name: Record same-host operational measurements
        shell: bash
        run: |
          metrics="$RUNNER_TEMP/runtime-measurements.jsonl"
          control_state="$RUNNER_TEMP/node24-control.json"
          node26_state="$RUNNER_TEMP/node26-control.json"
          EMBER_TEST_NOW=2026-08-30T12:00:00Z "$NODE24" bin/ember.mjs init --state "$control_state" --name Ember --principal user-1
          EMBER_TEST_NOW=2026-08-30T12:00:00Z "$NODE26" bin/ember.mjs init --state "$node26_state" --name Ember --principal user-1
          measure="$NODE24 experiments/runtime-evaluation/scripts/measure-process.mjs"
          $measure --label node24-cold-check --repeat 7 -- "$NODE24" bin/ember.mjs check --state "$control_state" >> "$metrics"
          $measure --label node26-js-cold-check --repeat 7 -- "$NODE26" bin/ember.mjs check --state "$node26_state" >> "$metrics"
          $measure --label node24-full-tests --repeat 3 -- "$NODE24" --test >> "$metrics"
          $measure --label node26-js-full-tests --repeat 3 -- "$NODE26" --test >> "$metrics"
          $measure --label node24-restart-oracle --repeat 3 -- "$NODE24" --test test/longitudinal-acceptance.test.mjs >> "$metrics"
          $measure --label node26-js-restart-oracle --repeat 3 -- "$NODE26" --test test/longitudinal-acceptance.test.mjs >> "$metrics"
          $measure --label node26-ts-tests --repeat 5 --cwd experiments/runtime-evaluation -- "$NODE26" --test test/model-semantics.test.ts test/runtime-workload.test.ts >> "$metrics"
          $measure --label node26-ts-typecheck --repeat 5 --cwd experiments/runtime-evaluation -- node_modules/.bin/tsc -p tsconfig.json >> "$metrics"
          EMBER_EVAL_PROVIDER_COMMAND="$DENO" EMBER_EVAL_PROVIDER_PREFIX_ARGS='["run","-A"]' \
            $measure --label deno-ts-tests --repeat 5 --cwd experiments/runtime-evaluation -- "$DENO" test -A test/model-semantics.test.ts test/runtime-workload.test.ts >> "$metrics"
          $measure --label deno-ts-check --repeat 5 --cwd experiments/runtime-evaluation -- "$DENO" check test/runtime-workload.test.ts >> "$metrics"
          echo '--- measurements ---'
          cat "$metrics"

      - name: Record footprint evidence
        shell: bash
        run: |
          {
            echo "node24_bytes=$(stat -c %s "$NODE24")"
            echo "node26_bytes=$(stat -c %s "$NODE26")"
            echo "deno_bytes=$(stat -c %s "$DENO")"
            echo "experiment_node_modules_kib=$(du -sk experiments/runtime-evaluation/node_modules | cut -f1)"
            echo "control_package_json=$(cat package.json | tr '\n' ' ')"
          } | tee "$RUNNER_TEMP/runtime-footprint.txt"

      - name: Upload raw evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evaluation-evidence
          path: |
            ${{ runner.temp }}/runtime-measurements.jsonl
            ${{ runner.temp }}/runtime-footprint.txt
            ${{ runner.temp }}/deno-current-oracle.log
            ${{ runner.temp }}/deno-format-check.log
            ${{ runner.temp }}/permission-*.out
            ${{ runner.temp }}/permission-*.err
