name: TypeScript runtime evaluation

on:
  pull_request:
    paths:
      - "experiments/runtime-evaluation/**"
      - "src/ember/**"
      - "test/**"
      - "test-fixtures/**"
      - "bin/**"
      - "docs/architecture/typescript-runtime-evaluation.md"
      - ".github/workflows/runtime-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 24 control
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Capture Node 24 path
        shell: bash
        run: |
          echo "NODE24=$(command -v node)" >> "$GITHUB_ENV"
          node --version
          npm --version

      - name: Install Node 26 candidate
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Capture Node 26 paths
        shell: bash
        run: |
          echo "NODE26=$(command -v node)" >> "$GITHUB_ENV"
          echo "NPM26=$(command -v npm)" >> "$GITHUB_ENV"
          node --version
          npm --version

      - name: Install Deno candidate
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Capture Deno path and host
        shell: bash
        run: |
          echo "DENO=$(command -v deno)" >> "$GITHUB_ENV"
          deno --version
          uname -a
          lscpu | sed -n '1,20p'
          free -h
          : > "$RUNNER_TEMP/runtime-status.tsv"

      - name: Run repository documentation discovery
        run: |
          "$NODE24" scripts/docs-discovery.mjs list

      - name: Validate unchanged JavaScript control on Node 24
        shell: bash
        run: |
          "$NODE24" --test test/*.mjs tests/*.test.mjs
          "$NODE24" --test tests/docs-discovery.test.mjs tests/docs-discovery-repository.test.mjs
          "$NODE24" scripts/docs-discovery.mjs check
          PATH="$(dirname "$NODE24"):$PATH" npm run check

      - name: Record unchanged JavaScript implementation on Node 26
        shell: bash
        run: |
          set +e
          "$NODE26" --test test/*.mjs tests/*.test.mjs
          status=$?
          set -e
          printf 'node26-current-js-oracle\t%s\n' "$status" | tee -a "$RUNNER_TEMP/runtime-status.tsv"

      - name: Install exact Node TypeScript experiment dependencies
        continue-on-error: true
        working-directory: experiments/runtime-evaluation
        shell: bash
        run: |
          "$NPM26" install --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --version
          "$NPM26" ls --all --json > "$RUNNER_TEMP/npm-tree.json"
          du -sk node_modules

      - name: Record Node TypeScript port results
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PROVIDER_COMMAND: ${{ env.NODE26 }}
          EMBER_EVAL_PROVIDER_PREFIX_ARGS: '[]'
        run: |
          probe() {
            local label="$1"
            shift
            set +e
            "$@" > >(tee "$RUNNER_TEMP/$label.out") 2> >(tee "$RUNNER_TEMP/$label.err" >&2)
            local status=$?
            set -e
            printf '%s\t%s\n' "$label" "$status" | tee -a "$RUNNER_TEMP/runtime-status.tsv"
          }
          probe node26-ts-typecheck ./node_modules/.bin/tsc -p tsconfig.json
          probe node26-ts-tests "$NODE26" --test test/*.test.ts
          probe node26-mcp "$NODE26" ecosystem/mcp-node.ts

      - name: Record Deno TypeScript and built-in-tooling results
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PROVIDER_COMMAND: ${{ env.DENO }}
          EMBER_EVAL_PROVIDER_PREFIX_ARGS: '["run","-A"]'
        run: |
          probe() {
            local label="$1"
            shift
            set +e
            "$@" > >(tee "$RUNNER_TEMP/$label.out") 2> >(tee "$RUNNER_TEMP/$label.err" >&2)
            local status=$?
            set -e
            printf '%s\t%s\n' "$label" "$status" | tee -a "$RUNNER_TEMP/runtime-status.tsv"
          }
          probe deno-check-core "$DENO" check src/*.ts test/*.test.ts
          probe deno-check-mcp "$DENO" check ecosystem/mcp-deno.ts
          probe deno-test "$DENO" test -A test/*.test.ts
          probe deno-lint "$DENO" lint
          probe deno-fmt "$DENO" fmt --check
          probe deno-mcp "$DENO" run ecosystem/mcp-deno.ts

      - name: Probe unchanged current JavaScript suite under Deno without changing the oracle
        shell: bash
        run: |
          set +e
          "$DENO" test -A test/*.mjs tests/*.test.mjs > >(tee "$RUNNER_TEMP/deno-current-oracle.out") 2> >(tee "$RUNNER_TEMP/deno-current-oracle.err" >&2)
          status=$?
          set -e
          printf 'deno-current-js-oracle\t%s\n' "$status" | tee -a "$RUNNER_TEMP/runtime-status.tsv"

      - name: Probe current production CLI directly under Deno
        shell: bash
        run: |
          state="$RUNNER_TEMP/deno-current-cli.json"
          set +e
          {
            "$DENO" run -A bin/ember.mjs init --state "$state" --name Ember --principal user-1 &&
            "$DENO" run -A bin/ember.mjs check --state "$state" &&
            printf 'hello from Deno\n:quit\n' | "$DENO" run -A bin/ember.mjs run \
              --state "$state" --principal user-1 --scope project:ember/docs \
              --provider-command "$DENO" --provider-arg run --provider-arg -A \
              --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          } > >(tee "$RUNNER_TEMP/deno-current-cli.out") 2> >(tee "$RUNNER_TEMP/deno-current-cli.err" >&2)
          status=$?
          set -e
          printf 'deno-current-js-cli\t%s\n' "$status" | tee -a "$RUNNER_TEMP/runtime-status.tsv"

      - name: Exercise Deno permission boundaries
        working-directory: experiments/runtime-evaluation
        shell: bash
        env:
          EMBER_EVAL_PERMISSION_SENTINEL: visible
        run: |
          target="$RUNNER_TEMP/permission-input.txt"
          output="$RUNNER_TEMP/permission-output.txt"
          printf 'readable\n' > "$target"
          expect_denied() {
            local label="$1"
            shift
            if "$DENO" run --no-prompt permission-probe.ts "$@" >"$RUNNER_TEMP/permission-$label.out" 2>"$RUNNER_TEMP/permission-$label.err"; then
              echo "expected $label denial but command succeeded" >&2
              return 1
            fi
          }
          expect_denied env-denied env
          "$DENO" run --no-prompt --allow-env=EMBER_EVAL_PERMISSION_SENTINEL permission-probe.ts env
          expect_denied read-denied read "$target"
          "$DENO" run --no-prompt --allow-read="$target" permission-probe.ts read "$target"
          expect_denied write-denied write "$output"
          "$DENO" run --no-prompt --allow-write="$output" permission-probe.ts write "$output"
          expect_denied run-denied run "$NODE26"
          "$DENO" run --no-prompt --allow-run="$NODE26" permission-probe.ts run "$NODE26"
          expect_denied net-denied net
          "$DENO" run --no-prompt --allow-net=127.0.0.1:9 permission-probe.ts net
          printf 'deno-permissions\t0\n' >> "$RUNNER_TEMP/runtime-status.tsv"

      - name: Record same-host operational measurements
        if: always()
        shell: bash
        run: |
          metrics="$RUNNER_TEMP/runtime-measurements.jsonl"
          template_state="$RUNNER_TEMP/measurement-template.json"
          node24_state="$RUNNER_TEMP/node24-measurement.json"
          node26_state="$RUNNER_TEMP/node26-measurement.json"
          deno_state="$RUNNER_TEMP/deno-measurement.json"
          EMBER_TEST_NOW=2026-08-30T12:00:00Z "$NODE24" bin/ember.mjs init \
            --state "$template_state" --name Ember --principal user-1
          run_measure() {
            local label="$1"
            shift
            set +e
            "$NODE24" experiments/runtime-evaluation/scripts/measure-process.mjs --label "$label" "$@" >> "$metrics"
            local status=$?
            set -e
            printf '%s\t%s\n' "measure-$label" "$status" >> "$RUNNER_TEMP/runtime-status.tsv"
          }
          run_measure node24-js-cold-check --repeat 7 --reset-file "$template_state" "$node24_state" -- \
            "$NODE24" bin/ember.mjs check --state "$node24_state"
          run_measure node26-js-cold-check --repeat 7 --reset-file "$template_state" "$node26_state" -- \
            "$NODE26" bin/ember.mjs check --state "$node26_state"
          run_measure deno-current-js-cold-check --repeat 7 --reset-file "$template_state" "$deno_state" -- \
            "$DENO" run -A bin/ember.mjs check --state "$deno_state"
          run_measure node24-js-full-tests --repeat 3 -- "$NODE24" --test test/*.mjs tests/*.test.mjs
          run_measure node26-js-full-tests --repeat 3 -- "$NODE26" --test test/*.mjs tests/*.test.mjs
          run_measure node24-js-restart-oracle --repeat 3 -- "$NODE24" --test test/longitudinal-acceptance.test.mjs
          run_measure node26-js-restart-oracle --repeat 3 -- "$NODE26" --test test/longitudinal-acceptance.test.mjs
          run_measure deno-current-js-restart-oracle --repeat 3 -- "$DENO" test -A test/longitudinal-acceptance.test.mjs
          run_measure node24-js-idle-cli --repeat 5 --reset-file "$template_state" "$node24_state" \
            --stdin-delay-ms 250 --stdin-text ':quit\n' -- "$NODE24" bin/ember.mjs run \
            --state "$node24_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$NODE24" --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure node26-js-idle-cli --repeat 5 --reset-file "$template_state" "$node26_state" \
            --stdin-delay-ms 250 --stdin-text ':quit\n' -- "$NODE26" bin/ember.mjs run \
            --state "$node26_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$NODE26" --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure deno-current-js-idle-cli --repeat 5 --reset-file "$template_state" "$deno_state" \
            --stdin-delay-ms 250 --stdin-text ':quit\n' -- "$DENO" run -A bin/ember.mjs run \
            --state "$deno_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$DENO" --provider-arg run --provider-arg -A \
            --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure node24-js-provider-cycle --repeat 7 --reset-file "$template_state" "$node24_state" \
            --stdin-text 'hello from measurement\n:quit\n' -- "$NODE24" bin/ember.mjs run \
            --state "$node24_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$NODE24" --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure node26-js-provider-cycle --repeat 7 --reset-file "$template_state" "$node26_state" \
            --stdin-text 'hello from measurement\n:quit\n' -- "$NODE26" bin/ember.mjs run \
            --state "$node26_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$NODE26" --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure deno-current-js-provider-cycle --repeat 7 --reset-file "$template_state" "$deno_state" \
            --stdin-text 'hello from measurement\n:quit\n' -- "$DENO" run -A bin/ember.mjs run \
            --state "$deno_state" --principal user-1 --scope project:ember/docs \
            --provider-command "$DENO" --provider-arg run --provider-arg -A \
            --provider-arg test-fixtures/providers/scripted-provider.mjs --provider-timeout-seconds 2
          run_measure node26-ts-tests --repeat 5 --cwd experiments/runtime-evaluation -- \
            "$NODE26" --test test/model-semantics.test.ts test/runtime-workload.test.ts
          run_measure node26-ts-typecheck --repeat 5 --cwd experiments/runtime-evaluation -- \
            node_modules/.bin/tsc -p tsconfig.json
          run_measure deno-ts-tests --repeat 5 --cwd experiments/runtime-evaluation -- env \
            EMBER_EVAL_PROVIDER_COMMAND="$DENO" EMBER_EVAL_PROVIDER_PREFIX_ARGS='["run","-A"]' \
            "$DENO" test -A test/model-semantics.test.ts test/runtime-workload.test.ts
          run_measure deno-ts-check --repeat 5 --cwd experiments/runtime-evaluation -- \
            "$DENO" check test/runtime-workload.test.ts
          echo '--- measurements ---'
          cat "$metrics"

      - name: Record footprint evidence
        if: always()
        shell: bash
        run: |
          {
            echo "node24_bytes=$(stat -c %s "$NODE24")"
            echo "node26_bytes=$(stat -c %s "$NODE26")"
            echo "deno_bytes=$(stat -c %s "$DENO")"
            echo "experiment_node_modules_kib=$(du -sk experiments/runtime-evaluation/node_modules | cut -f1)"
            echo "deno_cache_kib=$(du -sk "$HOME/.cache/deno" 2>/dev/null | cut -f1 || echo 0)"
            echo "canonical_measurement_store_bytes=$(stat -c %s "$RUNNER_TEMP/measurement-template.json")"
            echo "control_package_json=$(cat package.json | tr '\n' ' ')"
          } | tee "$RUNNER_TEMP/runtime-footprint.txt"
          echo '--- probe statuses ---'
          cat "$RUNNER_TEMP/runtime-status.tsv"

      - name: Upload raw evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evaluation-evidence
          path: |
            ${{ runner.temp }}/runtime-measurements.jsonl
            ${{ runner.temp }}/runtime-footprint.txt
            ${{ runner.temp }}/runtime-status.tsv
            ${{ runner.temp }}/npm-tree.json
            ${{ runner.temp }}/node26-*.out
            ${{ runner.temp }}/node26-*.err
            ${{ runner.temp }}/deno-*.out
            ${{ runner.temp }}/deno-*.err
            ${{ runner.temp }}/permission-*.out
            ${{ runner.temp }}/permission-*.err
