name: Issue 40 lockfile bootstrap

on:
  push:
    branches:
      - issue-40-adopt-typescript-node26
    paths:
      - package.json
      - .github/workflows/issue-40-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Generate lockfile from selected toolchain
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock selected TypeScript toolchain"
          git push
