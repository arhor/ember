name: Temporary #180 formatter autofix

on:
  push:
    branches:
      - research/180-composable-adoption-strategy
    paths:
      - docs/architecture/README.md
      - docs/architecture/composable-agent-infrastructure-strategy.md
      - .github/workflows/tmp-format-180.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npx oxfmt docs/architecture/README.md docs/architecture/composable-agent-infrastructure-strategy.md
      - name: Commit formatter output
        run: |
          if git diff --quiet -- docs/architecture/README.md docs/architecture/composable-agent-infrastructure-strategy.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/README.md docs/architecture/composable-agent-infrastructure-strategy.md
          git commit -m "docs: format composable agent infrastructure strategy"
          git push origin HEAD:research/180-composable-adoption-strategy
