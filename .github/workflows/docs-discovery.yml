name: Documentation discovery

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs-discovery.mjs"
      - "tests/docs-discovery*.test.mjs"
      - "AGENTS.md"
      - ".github/workflows/docs-discovery.yml"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "scripts/docs-discovery.mjs"
      - "tests/docs-discovery*.test.mjs"
      - "AGENTS.md"
      - ".github/workflows/docs-discovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Show Node.js version
        run: node --version
      - name: Run documentation discovery tests
        run: node --test tests/docs-discovery.test.mjs tests/docs-discovery-repository.test.mjs
      - name: Validate documentation discovery metadata
        run: node scripts/docs-discovery.mjs check
      - name: Exercise deterministic projections
        run: |
          node scripts/docs-discovery.mjs list > /tmp/docs-default.txt
          node scripts/docs-discovery.mjs list --deep > /tmp/docs-deep.txt
          node scripts/docs-discovery.mjs list --all > /tmp/docs-all.txt
          node scripts/docs-discovery.mjs list --headings \
            docs/architecture/design-directions.md \
            docs/research/memory-and-remembering.md \
            > /tmp/docs-headings.txt
