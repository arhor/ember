name: Documentation discovery

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/docs_discovery.py"
      - "tests/test_docs_discovery*.py"
      - "AGENTS.md"
      - ".github/workflows/docs-discovery.yml"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "scripts/docs_discovery.py"
      - "tests/test_docs_discovery*.py"
      - "AGENTS.md"
      - ".github/workflows/docs-discovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Python version
        run: python3 --version
      - name: Run documentation discovery tests
        run: python3 -m unittest discover -s tests -p 'test_docs_discovery*.py' -v
      - name: Validate documentation discovery metadata
        run: python3 scripts/docs_discovery.py check
      - name: Exercise deterministic projections
        run: |
          python3 scripts/docs_discovery.py list > /tmp/docs-default.txt
          python3 scripts/docs_discovery.py list --deep > /tmp/docs-deep.txt
          python3 scripts/docs_discovery.py list --all > /tmp/docs-all.txt
          python3 scripts/docs_discovery.py list --headings \
            docs/architecture/design-directions.md \
            docs/research/memory-and-remembering.md \
            > /tmp/docs-headings.txt
