name: Runtime resource evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/runtime-resource/**"
      - "docs/architecture/runtime-resource-evaluation.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-resource-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Record host identity
        run: |
          uname -a
          node --version
          lscpu
          free -m
      - name: Measure episodic runtime resource usage
        run: npm run eval:runtime-resource | tee runtime-resource-evidence.json
      - name: Upload raw resource evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-resource-evidence
          path: runtime-resource-evidence.json
          if-no-files-found: error
