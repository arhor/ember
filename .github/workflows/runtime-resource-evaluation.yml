name: Runtime resource evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bin/ember.ts"
      - "bin/ember-runtime.ts"
      - "src/agency/**"
      - "src/delegation/**"
      - "src/providers/**"
      - "src/runtime/**"
      - "eval/runtime-resource/**"
      - "docs/architecture/runtime-resource-evaluation.md"
      - "package.json"
      - ".github/workflows/runtime-resource-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked development toolchain
        run: npm ci
      - name: Show resource formatter diff
        run: |
          npx oxfmt eval/runtime-resource/run.ts eval/runtime-resource/fixture-codex.ts docs/architecture/runtime-resource-evaluation.md
          git diff -- eval/runtime-resource/run.ts eval/runtime-resource/fixture-codex.ts docs/architecture/runtime-resource-evaluation.md
          exit 1
