name: Temporary #180 recommendation consolidation

on:
  push:
    branches:
      - research/180-composable-adoption-strategy
    paths:
      - scripts/tmp-consolidate-180.py
      - .github/workflows/tmp-consolidate-180.yml
      - docs/architecture/composable-agent-infrastructure-strategy.md

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: python3 scripts/tmp-consolidate-180.py
      - run: npx oxfmt docs/architecture/composable-agent-infrastructure-strategy.md
      - name: Commit recommendation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp-consolidate-180.py .github/workflows/tmp-consolidate-180.yml
          git add docs/architecture/composable-agent-infrastructure-strategy.md
          git commit -m "docs: prefer one primary agent SDK"
          git push origin HEAD:research/180-composable-adoption-strategy
