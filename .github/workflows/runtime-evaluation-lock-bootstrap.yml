name: Runtime evaluation lock bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-evaluation-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Generate exact npm lockfile
        working-directory: experiments/runtime-evaluation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the pull-request branch
        working-directory: experiments/runtime-evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          encoded="$(base64 -w0 package-lock.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/experiments/runtime-evaluation/package-lock.json" \
            -f message='Lock runtime evaluation dependencies' \
            -f content="$encoded" \
            -f branch="$HEAD_BRANCH"
