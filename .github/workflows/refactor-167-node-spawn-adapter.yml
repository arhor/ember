name: Refactor typed Node spawn adapter

on:
  push:
    branches:
      - refactor/167-provider-process-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/167-provider-process-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
      - name: Install toolchain
        run: npm ci
      - name: Replace spawn casts with checked adapter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          async function replace(path, before, after) {
            const source = await readFile(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected block not found in ${path}`);
            await writeFile(path, source.replace(before, after));
          }

          await replace(
            'src/providers/process-lifecycle.ts',
            `import type { Readable, Writable } from "node:stream";`,
            `import { spawn } from "node:child_process";\n\nimport type { Readable, Writable } from "node:stream";`,
          );

          await replace(
            'src/providers/process-lifecycle.ts',
            `export type ProviderCliSpawn = ProviderProcessSpawn<ProviderCliSpawnOptions>;`,
            `export type ProviderCliSpawn = ProviderProcessSpawn<ProviderCliSpawnOptions>;\n\nexport const nodeProviderCliSpawn: ProviderCliSpawn = (command, arguments_, options) =>\n    spawn(command, arguments_, options);`,
          );

          for (const path of ['src/providers/codex.ts', 'src/providers/cursor.ts']) {
            await replace(path, `import { spawn } from "node:child_process";\n`, '');
            await replace(
              path,
              `import { runProviderProcess } from "./process-lifecycle.ts";`,
              `import { nodeProviderCliSpawn, runProviderProcess } from "./process-lifecycle.ts";`,
            );
            await replace(
              path,
              `spawnImpl = spawn as unknown as ProviderCliSpawn,`,
              `spawnImpl = nodeProviderCliSpawn,`,
            );
          }
          NODE

          npx oxfmt src/providers/process-lifecycle.ts src/providers/codex.ts src/providers/cursor.ts
          npm run check
          npm test

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-167-node-spawn-adapter.yml
          git add src/providers/process-lifecycle.ts src/providers/codex.ts src/providers/cursor.ts
          git commit -m "refactor: use typed Node spawn adapter"
          git push origin HEAD:refactor/167-provider-process-lifecycle
