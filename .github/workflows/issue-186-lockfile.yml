name: Issue 186 lockfile bootstrap

on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/issue-186-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-ai-sdk-cognition-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Generate and commit package lock
        run: |
          npm install --package-lock-only --ignore-scripts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Update package lock for AI SDK"
          git push
