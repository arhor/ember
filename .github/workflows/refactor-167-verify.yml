name: Verify provider process lifecycle refactor

on:
  push:
    branches:
      - refactor/167-provider-process-lifecycle

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npx oxlint --fix
      - run: npx oxfmt
      - name: Validate
        shell: bash
        run: |
          set +e
          npm run check > verify-167-check.txt 2>&1
          check_status=$?
          npm test > verify-167-test.txt 2>&1
          test_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$check_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            cat verify-167-check.txt
            cat verify-167-test.txt
            git add -A
            git commit -m "chore: capture provider lifecycle verification failure"
            git push
            exit 1
          fi

          rm verify-167-check.txt verify-167-test.txt
          rm .github/workflows/refactor-167-verify.yml
          git add -A
          git commit -m "test: verify shared provider process lifecycle"
          git push
