name: continuity-slice

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source and tests
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Run deterministic test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build dependency-free wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
