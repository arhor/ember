name: Issue 84 evidence format probe

on:
  pull_request:
    paths:
      - "docs/architecture/raspberry-pi-resource-evaluation.md"
      - ".github/workflows/issue-84-evidence-format-probe.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npx oxfmt docs/architecture/raspberry-pi-resource-evaluation.md
      - run: cat docs/architecture/raspberry-pi-resource-evaluation.md
