name: Issue 207 transport metrics

on:
  push:
    branches:
      - issue-207-telegram-api-v2

permissions:
  contents: write

jobs:
  measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-207-telegram-api-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare master baseline
        run: |
          git worktree add /tmp/ember-master origin/master
          npm --prefix /tmp/ember-master ci
      - name: Measure baseline and candidate
        run: |
          node scripts/telegram-transport-metrics.mjs compare \
            --baseline /tmp/ember-master \
            --candidate "$PWD" \
            --samples 5 > /tmp/telegram-metrics.json
          cat /tmp/telegram-metrics.json
      - name: Record operational evidence
        run: |
          BASELINE_SHA=$(git -C /tmp/ember-master rev-parse HEAD)
          CANDIDATE_SHA=$(git rev-parse HEAD)
          export BASELINE_SHA CANDIDATE_SHA
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const data = JSON.parse(await readFile("/tmp/telegram-metrics.json", "utf8"));
          const bytes = (value) => `${value} B (${(value / 1024).toFixed(1)} KiB)`;
          const rss = (value) => `${value} B (${(value / 1024 / 1024).toFixed(2)} MiB)`;
          const ms = (value) => `${value.toFixed(3)} ms`;
          const delta = (field, format) => {
              const value = data.delta[field];
              const relative = value.percent === null ? "n/a (zero baseline)" : `${value.percent >= 0 ? "+" : ""}${value.percent.toFixed(2)}%`;
              return `${format(value.absolute)}; ${relative}`;
          };
          const rows = [
              ["Total installed `node_modules`", "node_modules_bytes", bytes],
              ["`node-telegram-bot-api` installed footprint", "telegram_dependency_bytes", bytes],
              ["Idle worker RSS", "idle_rss_bytes", rss],
              ["Long-poll wait RSS", "polling_rss_bytes", rss],
              ["Idle shutdown latency", "idle_shutdown_ms", ms],
              ["Admitted-handler shutdown latency", "active_handler_shutdown_ms", ms],
          ];
          const lines = rows.map(([label, field, format]) =>
              `| ${label} | ${format(data.baseline[field])} | ${format(data.candidate[field])} | ${delta(field, format)} |`,
          );
          const markdown = `---
summary: "Measured issue #207 operational deltas for the Telegram transport migration from the direct-fetch worker to node-telegram-bot-api 2.1.0."
read_when:
  - "Reviewing Telegram transport resource cost, shutdown latency, or the operational evidence behind issue #207"
  - "Re-measuring the Telegram worker after changing its Bot API client, polling loop, or shutdown behavior"
role: reference
discovery_status: current
---

# Telegram Transport Operational Evidence

> Measurement date: 2026-09-08. This is comparative Linux CI evidence, not a claim of
> Raspberry Pi absolute memory or latency. Re-run the same probe on the target host when
> target-specific capacity numbers matter.

Issue #207 replaces Ember's hand-written Telegram HTTP plumbing with
\`node-telegram-bot-api@2.1.0\` while deliberately retaining Ember-owned polling,
offset acknowledgement, replay, delivery reconciliation, and shutdown admission.
This page records the requested before/after operational evidence.

## Measurement environment

- GitHub-hosted Ubuntu 24.04 x64 runner;
- Node ${data.environment.node};
- ${data.samples} isolated child-process samples per revision, median reported;
- baseline: \`${process.env.BASELINE_SHA}\` (current worker on \`master\`);
- candidate: \`${process.env.CANDIDATE_SHA}\` (issue #207 branch at measurement time);
- both revisions installed independently with their committed lockfiles.

## Results

| Metric | Baseline | Candidate | Absolute and relative delta |
| --- | ---: | ---: | ---: |
${lines.join("\n")}

The package-footprint delta is deterministic for these lockfiles. RSS and latency are
micro-benchmark evidence and naturally contain host/runtime noise; they are useful for
spotting order-of-magnitude regressions, not as target-host SLOs.

The active-handler latency probe intentionally makes one admitted provider handoff take
about 40 ms unless its signal is cancelled. The old worker propagated the service-stop
signal into that admitted handler; issue #207 instead drains the bounded handoff before
exit. Therefore a higher active-handler shutdown latency is an expected semantic cost
of truthful drain behavior, not by itself a regression.

## Reproduce

The probe lives in \`scripts/telegram-transport-metrics.mjs\`. For a side-by-side run,
install both revisions independently and execute:

\`\`\`bash
node scripts/telegram-transport-metrics.mjs compare \\
  --baseline /ABSOLUTE/PATH/TO/BASELINE \\
  --candidate /ABSOLUTE/PATH/TO/CANDIDATE \\
  --samples 5
\`\`\`

Run that same command on the Raspberry Pi deployment host when absolute Pi RSS or
shutdown latency becomes a capacity decision. Keep the baseline and candidate on the
same host, Node version, and install mode so the delta remains meaningful.
`;
          await writeFile("docs/architecture/telegram-transport-operational-evidence.md", markdown);
          NODE
      - run: npm run lint:fix
      - run: npm run fmt
      - name: Commit evidence and formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "docs: record Telegram transport operational evidence"
          git push
