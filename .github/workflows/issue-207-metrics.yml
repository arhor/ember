name: Issue 207 transport metrics

on:
  push:
    branches:
      - issue-207-telegram-api-v2

permissions:
  contents: write

jobs:
  measure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-207-telegram-api-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare master baseline
        run: |
          git worktree add /tmp/ember-master origin/master
          npm --prefix /tmp/ember-master ci
      - name: Measure baseline and candidate
        run: |
          node scripts/telegram-transport-metrics.mjs compare \
            --baseline /tmp/ember-master \
            --candidate "$PWD" \
            --samples 5
      - name: Apply repository formatting
        run: npm run fmt
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/telegram-transport-metrics.mjs docs/architecture/telegram-transport-operational-evidence.md
          git commit -m "chore: format Telegram migration evidence"
          git push
