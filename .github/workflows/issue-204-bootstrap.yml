name: Issue 204 bootstrap

on:
  push:
    branches:
      - feat/claude-code-ai-sdk-provider

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claude-code-ai-sdk-provider
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply source and documentation edits
        run: node scripts/issue-204-bootstrap.mjs
      - name: Update dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Format and lint-fix
        run: |
          npm install --ignore-scripts
          npx oxlint --fix
          npx oxfmt
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/ai-sdk.ts package.json package-lock.json docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate Claude Code through AI SDK"
          git push
