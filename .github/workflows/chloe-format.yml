name: Chloe format

on:
  push:
    branches:
      - chloe/218-cross-surface-conversation-continuity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx oxfmt src/core/conversation-context.ts src/persistence/conversation-context-store.ts src/runtime/runtime.ts src/surfaces/cli/surface.ts tests/recent-dialogue-projection.test.ts docs/architecture/cross-surface-conversation-continuity.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/conversation-context.ts src/persistence/conversation-context-store.ts src/runtime/runtime.ts src/surfaces/cli/surface.ts tests/recent-dialogue-projection.test.ts docs/architecture/cross-surface-conversation-continuity.md
          git commit -m "chore: format issue 218 changes"
          git push origin HEAD:${{ github.ref_name }}
