name: Issue 207 test fix

on:
  push:
    branches:
      - issue-207-telegram-api-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-207-telegram-api-v2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix pre-handoff failure scenario
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "src/surfaces/telegram.test.ts";
          let text = await readFile(path, "utf8");
          const from = `    try {
        await rm(f.statePath);
        let polls = 0;
        const api = readyApi({`;
          const to = `    try {
        const config = { ...f.config, principal: "intruder" };
        let polls = 0;
        const api = readyApi({`;
          if (!text.includes(from)) throw new Error("pre-handoff test setup not found");
          text = text.replace(from, to);
          const oldAssertion = `        await assert.rejects(runTelegramPolling(f.config, api), /continuity store is unavailable/);`;
          const newAssertion = `        await assert.rejects(runTelegramPolling(config, api), /principal/);`;
          if (!text.includes(oldAssertion)) throw new Error("pre-handoff test assertion not found");
          text = text.replace(oldAssertion, newAssertion);
          await writeFile(path, text);
          NODE
      - run: npm run fmt
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/surfaces/telegram.test.ts
          git commit -m "test: fail Telegram update after polling before durable handoff"
          git push
