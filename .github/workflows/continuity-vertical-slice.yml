name: Continuity vertical slice

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"
  push:
    branches:
      - master
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Show Node.js version
        run: node --version
      - name: Install locked development toolchain
        run: npm ci
      - name: Run static and repository checks
        run: npm run check
      - name: Capture formatted capability files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-189-formatted
          path: |
            src/capabilities/execution.test.ts
            src/capabilities/execution.ts
            src/capabilities/local-lookup.ts
            src/providers/ai-sdk.ts
            tests/ai-sdk-capabilities.test.ts
      - name: Run complete acceptance suite
        run: npm test
      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous
