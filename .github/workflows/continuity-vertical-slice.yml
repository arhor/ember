name: Continuity vertical slice

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"
  push:
    branches:
      - master
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Show Node.js version
        run: node --version
      - name: Install locked development toolchain
        run: npm ci
      - name: Apply formatter output
        if: github.event_name == 'pull_request'
        run: |
          npm run fmt
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add docs/architecture/endogenous-cognition-decision.md eval/longitudinal/run.ts src/delegation/codex-specialist.test.ts tests/semantic-continuity-evaluation.test.ts
            git commit -m "style: apply oxfmt"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run static and repository checks
        run: npm run check
      - name: Run complete acceptance suite
        run: npm test
      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous
