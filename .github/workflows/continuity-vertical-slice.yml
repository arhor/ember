name: Continuity vertical slice

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "test-fixtures/**"
      - "scripts/**"
      - "experiments/external-agent-runtime/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"
  push:
    branches:
      - master
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "test-fixtures/**"
      - "scripts/**"
      - "experiments/external-agent-runtime/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Show Node.js version
        run: node --version
      - name: Install locked development toolchain
        run: npm ci
      - name: Run static and repository checks
        id: static
        continue-on-error: true
        run: npm run check > static-check.log 2>&1
      - name: Upload static check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-log
          path: static-check.log
      - name: Surface static check failure
        if: steps.static.outcome == 'failure'
        run: |
          cat static-check.log
          exit 1
      - name: Run complete acceptance suite
        run: npm test
      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous
