name: Continuity vertical slice

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"
  push:
    branches:
      - master
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Show Node.js version
        run: node --version
      - name: Install locked development toolchain
        run: npm ci
      - name: Normalize moved documentation paths
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile, writeFile } from "node:fs/promises";

          const replacements = [
            ["test-fixtures/providers/*.mjs", "tests/fixtures/providers/*.ts"],
            ["test-fixtures/endogenous/restart-scenarios.json", "eval/endogenous-restart/fixtures/restart-scenarios.json"],
            ["test-fixtures/endogenous/selectivity-workload.json", "eval/endogenous/fixtures/selectivity-workload.json"],
            ["test-fixtures/longitudinal/", "eval/longitudinal/fixtures/"],
            ["test-fixtures/providers/", "tests/fixtures/providers/"],
            ["scripts/run-longitudinal-scenario.ts", "eval/longitudinal/run.ts"],
            ["scripts/run-process-restart-scenario.ts", "eval/process-restart/run.ts"],
            ["scripts/run-endogenous-restart-scenario.ts", "eval/endogenous-restart/run.ts"],
            ["scripts/run-endogenous-selectivity-evaluation.ts", "eval/endogenous/run.ts"],
            ["scripts/live-codex-smoke.ts", "tests/live/codex-smoke.ts"],
            ["scripts/live-cursor-smoke.ts", "tests/live/cursor-smoke.ts"],
            ["scripts/live-codex-specialist.ts", "tests/live/codex-specialist.ts"],
            ["scripts/live-cognition-opportunity.ts", "tests/live/cognition-opportunity.ts"],
            ["scripts/live-episodic-runtime-smoke.ts", "tests/live/episodic-runtime-smoke.ts"],
          ];
          const files = execFileSync("git", ["ls-files", "*.md"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);
          for (const file of files) {
            const original = await readFile(file, "utf8");
            let updated = original;
            for (const [before, after] of replacements) updated = updated.split(before).join(after);
            if (updated !== original) await writeFile(file, updated, "utf8");
          }
          NODE
          npm run fmt
          if git grep -nE 'test-fixtures/|scripts/(run-longitudinal-scenario|run-process-restart-scenario|run-endogenous-restart-scenario|run-endogenous-selectivity-evaluation|live-codex-smoke|live-cursor-smoke|live-codex-specialist|live-cognition-opportunity|live-episodic-runtime-smoke)\.ts' -- '*.md'; then
            echo 'Stale moved documentation path remains.' >&2
            exit 1
          fi
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- '*.md'
            git commit -m "docs: update moved evaluation paths"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run static and repository checks
        run: npm run check
      - name: Run complete acceptance suite
        run: npm test
      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous
