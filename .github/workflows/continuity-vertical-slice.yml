name: Continuity vertical slice

on:
  pull_request:
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"
  push:
    branches:
      - master
    paths:
      - "bin/**"
      - "src/**"
      - "eval/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/continuity-vertical-slice.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Show Node.js version
        run: node --version
      - name: Install locked development toolchain
        run: npm ci
      - name: Normalize moved test fixture paths
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile, writeFile } from "node:fs/promises";

          const files = execFileSync("git", ["ls-files", "*.ts"], { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);
          for (const file of files) {
            const original = await readFile(file, "utf8");
            let updated = original
              .split('"test-fixtures", "providers"').join('"tests", "fixtures", "providers"')
              .split("test-fixtures/providers/").join("tests/fixtures/providers/");
            if (file === "tests/provider-cli.test.ts") {
              updated = updated
                .replace('import { join } from "node:path";', 'import { join, matchesGlob } from "node:path";')
                .replace(
`    const automaticDiscoveryRoot = join(ROOT, "tests");
    // When
    const providerIsInside = PROVIDER === automaticDiscoveryRoot || PROVIDER.startsWith(\`${automaticDiscoveryRoot}/\`);
    // Then
    assert.equal(providerIsInside, false);`,
`    const automaticDiscoveryPattern = join(ROOT, "tests", "*.test.ts");
    // When
    const providerIsDiscovered = matchesGlob(PROVIDER, automaticDiscoveryPattern);
    // Then
    assert.equal(providerIsDiscovered, false);`,
                );
            }
            if (updated !== original) await writeFile(file, updated, "utf8");
          }
          NODE
          npm run fmt
          if git grep -n 'test-fixtures/' -- '*.ts'; then
            echo 'Stale test-fixtures path remains in TypeScript.' >&2
            exit 1
          fi
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -- '*.ts'
            git commit -m "test: update moved provider fixture paths"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Run static and repository checks
        run: npm run check
      - name: Run complete acceptance suite
        run: npm test
      - name: Run deterministic endogenous selectivity evaluation
        run: npm run eval:endogenous
