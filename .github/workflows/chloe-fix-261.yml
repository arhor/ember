name: Chloe PR 261 review fixes

on:
  push:
    branches:
      - chloe/218-cross-surface-conversation-continuity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply review fixes
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function edit(path, mutate) {
            const before = readFileSync(path, 'utf8');
            const after = mutate(before);
            if (after === before) throw new Error(`no changes made to ${path}`);
            writeFileSync(path, after);
          }

          function replaceOnce(text, before, after, label) {
            const index = text.indexOf(before);
            if (index < 0) throw new Error(`missing replacement anchor: ${label}`);
            if (text.indexOf(before, index + before.length) >= 0) throw new Error(`ambiguous replacement anchor: ${label}`);
            return text.slice(0, index) + after + text.slice(index + before.length);
          }

          edit('src/core/conversation-context.ts', (input) => {
            let text = input;
            text = replaceOnce(
              text,
              'export type ConversationId = `conversation-${string}`;\n\nexport interface ActiveConversationTrajectory',
              'export type ConversationId = `conversation-${string}`;\n\nexport type ConversationMembershipBasis =\n    | "ordinary_adjacency"\n    | "explicit_resumption"\n    | "explicit_boundary"\n    | "ambiguous_discourse"\n    | "initial_interaction";\n\nexport interface ConversationMembershipResolution {\n    action: "continued" | "started";\n    basis: ConversationMembershipBasis;\n}\n\nexport interface ActiveConversationTrajectory',
              'conversation membership types',
            );
            text = replaceOnce(
              text,
              '        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\n        selected_exchange_count: number;',
              '        strategy: typeof RECENT_DIALOGUE_SELECTION_STRATEGY;\n        membership: ConversationMembershipResolution | null;\n        selected_exchange_count: number;',
              'projected membership field',
            );
            text = replaceOnce(
              text,
              'export function emptyConversationContext(conversationId: ConversationId | null = null): ProjectedConversationContext {',
              'export function emptyConversationContext(\n    conversationId: ConversationId | null = null,\n    membership: ConversationMembershipResolution | null = null,\n): ProjectedConversationContext {',
              'empty context signature',
            );
            text = replaceOnce(
              text,
              '            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\n            selected_exchange_count: 0,',
              '            strategy: RECENT_DIALOGUE_SELECTION_STRATEGY,\n            membership,\n            selected_exchange_count: 0,',
              'empty context membership',
            );
            text = replaceOnce(
              text,
              '        conversationId,\n    }: {\n        principal: string;\n        scope: string;\n        conversationId: ConversationId;\n    },',
              '        conversationId,\n        membership,\n    }: {\n        principal: string;\n        scope: string;\n        conversationId: ConversationId;\n        membership: ConversationMembershipResolution;\n    },',
              'selector membership argument',
            );
            text = replaceOnce(
              text,
              '    const result = emptyConversationContext(conversationId);',
              '    const result = emptyConversationContext(conversationId, membership);',
              'selector membership projection',
            );
            text = replaceOnce(
              text,
              '    validateActiveTrajectories(value.active_trajectories);\n    validateExchangeCollection(value.exchanges, false);',
              '    const activeOwners = validateActiveTrajectories(value.active_trajectories);\n    const exchangeOwners = validateExchangeCollection(value.exchanges, false);\n    for (const [conversationId, activeOwner] of activeOwners) {\n        const exchangeOwner = exchangeOwners.get(conversationId);\n        if (exchangeOwner !== undefined && exchangeOwner !== activeOwner) {\n            throw new ValidationError(\n                `conversation context active trajectory ${conversationId} crosses principal or scope boundary`,\n            );\n        }\n    }',
              'cross collection ownership validation',
            );
            text = replaceOnce(
              text,
              'function validateActiveTrajectories(value: unknown[]) {\n    const activePairs = new Set<string>();\n    const activeIds = new Set<string>();',
              'function validateActiveTrajectories(value: unknown[]): Map<string, string> {\n    const activePairs = new Set<string>();\n    const activeIds = new Set<string>();\n    const owners = new Map<string, string>();',
              'active trajectory validator return type',
            );
            text = replaceOnce(
              text,
              '        activePairs.add(pair);\n        activeIds.add(raw.conversation_id);\n    }\n}\n\nfunction validateExchangeCollection(value: unknown[], legacy: boolean) {',
              '        activePairs.add(pair);\n        activeIds.add(raw.conversation_id);\n        owners.set(raw.conversation_id, pair);\n    }\n    return owners;\n}\n\nfunction validateExchangeCollection(value: unknown[], legacy: boolean): Map<string, string> {',
              'validator maps',
            );
            text = replaceOnce(
              text,
              '        if (expressionPresent && Date.parse(raw.started_at) > Date.parse(raw.expression_occurred_at)) {\n            throw new ValidationError(`${path} expression cannot precede cognition start`);\n        }\n    }\n}\n\nfunction validateConversationId',
              '        if (expressionPresent && Date.parse(raw.started_at) > Date.parse(raw.expression_occurred_at)) {\n            throw new ValidationError(`${path} expression cannot precede cognition start`);\n        }\n    }\n    return conversationOwners;\n}\n\nfunction validateConversationId',
              'exchange validator return',
            );
            return text;
          });

          edit('src/persistence/conversation-context-store.ts', (input) => {
            let text = input;
            text = replaceOnce(
              text,
              '    ConversationContextDocument,\n    ConversationExchangeRecord,',
              '    ActiveConversationTrajectory,\n    ConversationContextDocument,\n    ConversationExchangeRecord,',
              'active trajectory import',
            );
            text = replaceOnce(
              text,
              '    async currentConversation(principal: string, scope: string, startedAt = nowUtc()): Promise<ConversationId> {\n        validateTrajectoryInput(principal, scope, startedAt);\n        const document = await this.load();\n        const active = document.active_trajectories.find(\n            (trajectory) => trajectory.principal === principal && trajectory.scope === scope,\n        );\n        if (active) {\n            return active.conversation_id;\n        }\n\n        const conversationId = newConversationId();\n        document.active_trajectories.push({\n            conversation_id: conversationId,\n            principal,\n            scope,\n            started_at: startedAt,\n        });\n        await this.writeDocument(document);\n        return conversationId;\n    }',
              '    async activeConversation(principal: string, scope: string): Promise<ActiveConversationTrajectory | null> {\n        validateTrajectoryOwner(principal, scope);\n        const document = await this.load();\n        const active = document.active_trajectories.find(\n            (trajectory) => trajectory.principal === principal && trajectory.scope === scope,\n        );\n        return active ? structuredClone(active) : null;\n    }',
              'store membership lookup',
            );
            text = replaceOnce(
              text,
              'function validateTrajectoryInput(principal: string, scope: string, startedAt: string) {\n    if (!principal.trim()) throw new ValidationError("conversation principal must be non-empty");\n    if (!scope.trim()) throw new ValidationError("conversation scope must be non-empty");\n    if (!isRfc3339Utc(startedAt)) throw new ValidationError("conversation start must be RFC 3339 UTC");\n}',
              'function validateTrajectoryOwner(principal: string, scope: string) {\n    if (!principal.trim()) throw new ValidationError("conversation principal must be non-empty");\n    if (!scope.trim()) throw new ValidationError("conversation scope must be non-empty");\n}\n\nfunction validateTrajectoryInput(principal: string, scope: string, startedAt: string) {\n    validateTrajectoryOwner(principal, scope);\n    if (!isRfc3339Utc(startedAt)) throw new ValidationError("conversation start must be RFC 3339 UTC");\n}',
              'trajectory validation split',
            );
            return text;
          });

          edit('src/runtime/runtime.ts', (input) => {
            let text = input;
            text = replaceOnce(
              text,
              'import type { StateStore } from "../persistence/state-store.ts";',
              'import type { ConversationId, ConversationMembershipResolution } from "../core/conversation-context.ts";\nimport type { StateStore } from "../persistence/state-store.ts";',
              'membership imports',
            );
            text = replaceOnce(
              text,
              'export interface RunCognitionOptions {',
              'export type ConversationMembershipIntent =\n    | { action: "continue"; basis: "ordinary_adjacency" | "explicit_resumption" }\n    | { action: "fresh"; basis: "explicit_boundary" | "ambiguous_discourse" };\n\nexport interface RunCognitionOptions {',
              'membership intent type',
            );
            text = replaceOnce(
              text,
              '    explainIds?: Array<MeaningId | string>;\n    cognitionId?: CognitionId;',
              '    explainIds?: Array<MeaningId | string>;\n    conversationMembership?: ConversationMembershipIntent;\n    cognitionId?: CognitionId;',
              'membership option',
            );
            text = replaceOnce(
              text,
              '        purpose = "ordinary",\n        explainIds = [],\n        cognitionId: requestedCognitionId,',
              '        purpose = "ordinary",\n        explainIds = [],\n        conversationMembership = { action: "continue", basis: "ordinary_adjacency" },\n        cognitionId: requestedCognitionId,',
              'membership default',
            );
            text = replaceOnce(
              text,
              '    const timestamp = nowUtc();\n    const conversationStore = new ConversationContextStore(store.path);\n    const conversationId = await conversationStore.currentConversation(principal, scope, timestamp);\n    const conversationContext = selectRecentConversationContext(state, await conversationStore.load(), {\n        principal,\n        scope,\n        conversationId,\n    });',
              '    const timestamp = nowUtc();\n    const conversationStore = new ConversationContextStore(store.path);\n    const resolvedConversation = await resolveConversationMembership(\n        conversationStore,\n        principal,\n        scope,\n        conversationMembership,\n        timestamp,\n    );\n    const conversationId = resolvedConversation.conversationId;\n    const conversationContext = selectRecentConversationContext(state, await conversationStore.load(), {\n        principal,\n        scope,\n        conversationId,\n        membership: resolvedConversation.membership,\n    });',
              'runtime conversation resolution',
            );
            const helperAnchor = '\nexport async function runCognition(\n';
            const helper = '\nasync function resolveConversationMembership(\n    store: ConversationContextStore,\n    principal: string,\n    scope: string,\n    intent: ConversationMembershipIntent,\n    startedAt: string,\n): Promise<{ conversationId: ConversationId; membership: ConversationMembershipResolution }> {\n    if (intent.action === "fresh") {\n        return {\n            conversationId: await store.startFreshConversation(principal, scope, startedAt),\n            membership: { action: "started", basis: intent.basis },\n        };\n    }\n\n    const active = await store.activeConversation(principal, scope);\n    if (active) {\n        return {\n            conversationId: active.conversation_id,\n            membership: { action: "continued", basis: intent.basis },\n        };\n    }\n    if (intent.basis === "explicit_resumption") {\n        throw new ValidationError("cannot explicitly resume a conversation without an active Ember-owned trajectory");\n    }\n    return {\n        conversationId: await store.startFreshConversation(principal, scope, startedAt),\n        membership: { action: "started", basis: "initial_interaction" },\n    };\n}\n';
            text = replaceOnce(text, helperAnchor, helper + helperAnchor, 'membership resolver helper');
            return text;
          });

          edit('tests/recent-dialogue-projection.test.ts', (input) => {
            let text = input;
            text = replaceOnce(
              text,
              'import { runCognition, startRuntime, stopRuntime } from "../src/runtime/runtime.ts";',
              'import type { ConversationMembershipIntent } from "../src/runtime/runtime.ts";\n\nimport { runCognition, startRuntime, stopRuntime } from "../src/runtime/runtime.ts";',
              'test membership type import',
            );
            text = replaceOnce(
              text,
              '    { surface = "local_cli" }: { surface?: string } = {},',
              '    {\n        surface = "local_cli",\n        conversationMembership,\n    }: { surface?: string; conversationMembership?: ConversationMembershipIntent } = {},',
              'runTurn options',
            );
            text = replaceOnce(
              text,
              '        timeoutSeconds: 1,\n        output: () => {},',
              '        timeoutSeconds: 1,\n        ...(conversationMembership === undefined ? {} : { conversationMembership }),\n        output: () => {},',
              'runTurn membership forwarding',
            );
            text = replaceOnce(
              text,
              '        const conversationId = await conversationStore.currentConversation(PRINCIPAL, SCOPE, startedAt);',
              '        const conversationId = await conversationStore.startFreshConversation(PRINCIPAL, SCOPE, startedAt);',
              'acceptance order conversation setup',
            );
            const anchor = 'test("clean process restart continues the same conversation with a fresh provider invocation", async () => {';
            const inserted = `test("membership policy can start a new same-owner trajectory without changing operational identity", async () => {\n    const fixture = await startedFixture();\n    const requests: ProviderRequest[] = [];\n    const provider = capturingProvider(requests, () => "ack");\n    try {\n        await runTurn(fixture, provider, "first topic", { surface: "local_cli" });\n        const firstConversationId = requests[0]?.projection.conversation_context?.conversation_id;\n        assert.ok(firstConversationId);\n\n        await runTurn(fixture, provider, "unrelated topic", {\n            surface: "local_cli",\n            conversationMembership: { action: "fresh", basis: "ambiguous_discourse" },\n        });\n        const freshContext = requests[1]?.projection.conversation_context;\n        assert.ok(freshContext?.conversation_id);\n        assert.notEqual(freshContext.conversation_id, firstConversationId);\n        assert.deepEqual(freshContext.turns, []);\n        assert.deepEqual(freshContext.selection.membership, { action: "started", basis: "ambiguous_discourse" });\n\n        await runTurn(fixture, provider, "continue new topic", { surface: "local_cli" });\n        const continuedContext = requests[2]?.projection.conversation_context;\n        assert.equal(continuedContext?.conversation_id, freshContext.conversation_id);\n        assert.deepEqual(continuedContext?.selection.membership, {\n            action: "continued",\n            basis: "ordinary_adjacency",\n        });\n        assert.deepEqual(\n            continuedContext?.turns.map((turn) => [turn.role, turn.content]),\n            [\n                ["user", "unrelated topic"],\n                ["ember", "ack"],\n            ],\n        );\n    } finally {\n        await closeFixture(fixture);\n    }\n});\n\n`;
            text = replaceOnce(text, anchor, inserted + anchor, 'same-owner fresh trajectory test');
            return text;
          });

          edit('docs/architecture/cross-surface-conversation-continuity.md', (input) => {
            let text = input;
            text = replaceOnce(
              text,
              'The current v2 mechanic keeps one active trajectory per principal/scope pair. Once a\ntrajectory is established, a later compatible interaction continues that explicit\ntrajectory even when its surface changes. Principal/scope compatibility is therefore\na safety boundary for an already established trajectory, not the semantic identity of\nthe trajectory itself.\n\nThis is intentionally a minimal executable heuristic. The #216 design remains\nstronger: equal principal/scope values alone do not prove that arbitrary historical\ninteractions belong to one discourse trajectory. A future discourse router may split,\nresume, or correlate multiple concurrent trajectories using stronger evidence without\nchanging the provider contract or promoting surface IDs into semantic identity.',
              'The current v2 persistence mechanic keeps one active trajectory per principal/scope\npair, but the store does **not** infer conversation membership from that pair.\n`runCognition(...)` resolves an explicit membership intent above the store. Ordinary\nadjacent interaction may continue the active trajectory; an explicit boundary or an\nambiguous-discourse decision starts a different Ember-owned trajectory even when\nprincipal, scope, surface, runtime, and provider are unchanged. The first interaction\ncreates an initial trajectory.\n\nPrincipal/scope compatibility is therefore a safety boundary for candidate\ncontinuation, not evidence that arbitrary interactions belong to one conversation.\nThe current default policy uses ordinary adjacency when no stronger boundary signal is\nsupplied, matching the minimal heuristic permitted by #216. A future discourse router\ncan supply stronger continue/fresh decisions, split or resume multiple trajectories,\nor preserve richer uncertainty without changing the persistence contract or promoting\nsurface IDs into semantic identity.',
              'architecture membership policy',
            );
            text = replaceOnce(
              text,
              'The provider-facing `conversation_context` now carries `context_version: 2` and the\nselected `conversation_id`. Selection metadata uses\n`recent_same_conversation_v2`. Individual turns continue to expose their source',
              'The provider-facing `conversation_context` now carries `context_version: 2`, the\nselected `conversation_id`, and inspectable membership metadata describing whether the\ntrajectory was continued or started and on what Ember-owned policy basis. Selection\nmetadata uses `recent_same_conversation_v2`. Individual turns continue to expose their source',
              'architecture inspectability',
            );
            return text;
          });
          NODE
      - name: Add validator regression test
        run: |
          cat > tests/conversation-context-validation.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";

          import { validateConversationContextDocument } from "../src/core/conversation-context.ts";

          test("conversation sidecar rejects an active trajectory whose id belongs to another owner", () => {
              assert.throws(
                  () =>
                      validateConversationContextDocument({
                          conversation_context_version: 2,
                          active_trajectories: [
                              {
                                  conversation_id: "conversation-owner-conflict",
                                  principal: "max",
                                  scope: "scope-a",
                                  started_at: "2026-09-09T12:02:00Z",
                              },
                          ],
                          exchanges: [
                              {
                                  conversation_id: "conversation-owner-conflict",
                                  cognition_id: "cognition-owner-conflict",
                                  principal: "max",
                                  scope: "scope-b",
                                  surface: "local_cli",
                                  input_evidence_id: "evidence-owner-conflict",
                                  started_at: "2026-09-09T12:02:00Z",
                                  expression_evidence_id: null,
                                  expression_occurred_at: null,
                                  expression_content: null,
                                  expression_content_truncated: null,
                              },
                          ],
                      }),
                  /active trajectory conversation-owner-conflict crosses principal or scope boundary/,
              );
          });
          EOF
      - name: Format
        run: npx oxfmt src/core/conversation-context.ts src/persistence/conversation-context-store.ts src/runtime/runtime.ts tests/recent-dialogue-projection.test.ts tests/conversation-context-validation.test.ts docs/architecture/cross-surface-conversation-continuity.md
      - name: Validate
        run: |
          npm run check
          npm test
      - name: Commit fixes
        run: |
          rm .github/workflows/chloe-fix-261.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make conversation membership explicit"
          git push origin HEAD:${{ github.ref_name }}
