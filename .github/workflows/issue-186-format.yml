name: Issue 186 formatter bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/issue-186-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-186-ai-sdk-cognition-adapter
      - uses: actions/setup-node@v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Format and commit
        run: |
          npm ci
          npm run fmt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/providers/ai-sdk.ts tests/ai-sdk-provider.test.ts
          git diff --cached --quiet || git commit -m "Format AI SDK adapter"
          git push
